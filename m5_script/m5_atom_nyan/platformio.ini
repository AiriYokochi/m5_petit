[platformio]
default_envs = puchiteya

[env]
platform = espressif32 @ 6.12.0
framework = Arduino
upload_speed = 1500000
lib_deps =
    M5Stack/M5Unified @ ^0.1.16
    meganetaaan/M5Stack-Avatar @ ^0.9.2

; ぷちてゃ (カナリアイエロー #fff262)
[env:puchiteya]
board = m5stack-atoms3
build_flags = -D PUCHITEYA

; ぷちこ (ラベンダー #cab8d9)
[env:puchiko]
board = m5stack-atoms3
build_flags = -D PUCHIKO

; ぷちる (ターコイズ #00afcc)
[env:puchiru]
board = m5stack-atoms3
build_flags = -D PUCHIRU
